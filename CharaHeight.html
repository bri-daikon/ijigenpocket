<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身長比較の儀 - Grimoire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050b14;
            --cm-px: 3.5px; /* 1cmあたりのピクセル数 */
        }
        body {
            background-color: var(--bg-color);
            font-family: 'Noto Serif JP', serif;
            overflow: hidden; /* 全体はスクロールさせない */
        }
        .font-header {
            font-family: 'Cinzel', 'Noto Serif JP', serif;
        }

        /* スクロールバー */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b111a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #164e63; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #0891b2; 
        }

        /* 身長の目盛り背景 */
        .height-stage {
            background-image: repeating-linear-gradient(
                to bottom,
                transparent,
                transparent calc(10 * var(--cm-px) - 1px),
                rgba(6, 182, 212, 0.1) calc(10 * var(--cm-px) - 1px),
                rgba(6, 182, 212, 0.1) calc(10 * var(--cm-px))
            );
            background-position: bottom;
            background-size: 100% 100%;
        }
        
        .height-line {
            position: absolute;
            left: 0;
            right: 0;
            border-bottom: 1px dashed rgba(6, 182, 212, 0.3);
            pointer-events: none;
            display: flex;
            align-items: flex-end;
            padding-left: 8px;
            padding-bottom: 2px;
            color: rgba(6, 182, 212, 0.6);
            font-size: 10px;
            font-family: monospace;
            z-index: 0;
        }
        .height-line.major {
            border-bottom: 1px solid rgba(6, 182, 212, 0.5);
            font-weight: bold;
            color: rgba(6, 182, 212, 0.9);
        }

        .chara-silhouette {
            mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 300"><path d="M50 10c11 0 20 9 20 20s-9 20-20 20-20-9-20-20 9-20 20-20zM30 60h40c11 0 20 9 20 20v100h-15v110h-20V190H45v100H25V180H10V80c0-11 9-20 20-20z" fill="white"/></svg>');
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: bottom;
            background-color: #164e63;
        }
    </style>
</head>
<body class="text-stone-200 h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="border-b border-cyan-900/40 bg-[#050b14]/90 backdrop-blur-md flex-none z-40 px-4 py-4 sm:px-6 shadow-[0_4px_30px_rgba(0,0,0,0.9)]">
        <div class="max-w-7xl mx-auto flex items-center justify-between w-full">
            <div class="flex items-center gap-4">
                <div class="p-3 bg-gradient-to-br from-cyan-700 to-cyan-950 rounded-xl text-cyan-100 shadow-[0_0_15px_rgba(6,182,212,0.2)]">
                    <i data-lucide="ruler" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-widest font-header text-cyan-400 bg-gradient-to-r from-cyan-300 via-cyan-100 to-cyan-500 bg-clip-text text-transparent">
                        身長比較の儀</h1>
                    <p class="text-[10px] sm:text-[11px] text-cyan-700/80 tracking-widest font-header mt-0.5">GRIMOIRE OF HEIGHT COMPARISON</p>
                </div>
            </div>
            <div class="flex gap-2">
                <a href="CharaProfile.html" class="flex items-center justify-center p-2 sm:px-4 sm:py-2 bg-[#0b111a] hover:bg-cyan-950/40 text-cyan-400 text-sm font-bold rounded-lg border border-cyan-900/50 transition-all font-header shadow-lg">
                    <i data-lucide="arrow-left" class="w-4 h-4 sm:mr-1"></i>
                    <span class="hidden sm:inline">調書に戻る</span>
                </a>
            </div>
        </div>
    </header>

    <main class="flex-grow flex overflow-hidden">
        
        <!-- 左カラム：キャラクター選択 -->
        <aside class="w-64 sm:w-72 border-r border-cyan-900/30 bg-[#0a1018] flex flex-col z-20 shadow-xl flex-none">
            <div class="p-4 border-b border-cyan-900/30">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-stone-500"></i>
                    <input type="text" id="searchInput" placeholder="名前で検索..." class="w-full bg-[#131b26] border border-cyan-900/40 text-stone-300 text-sm rounded-lg pl-9 pr-3 py-2 focus:outline-none focus:border-cyan-600 focus:ring-1 focus:ring-cyan-600 transition-colors" oninput="renderList()">
                </div>
            </div>
            
            <div class="p-3 border-b border-cyan-900/30 flex justify-between items-center text-xs text-cyan-600 font-bold">
                <span>比較対象</span>
                <button onclick="clearSelection()" class="hover:text-cyan-400 transition-colors">全解除</button>
            </div>

            <div id="characterList" class="flex-grow overflow-y-auto p-2 space-y-1">
                <!-- JSでリスト生成 -->
            </div>
        </aside>

        <!-- 右カラム：ステージ -->
        <div class="flex-grow relative bg-[#050b14] overflow-hidden flex flex-col">
            
            <!-- コントロールバー -->
            <div class="absolute top-4 right-4 z-30 flex gap-2">
                <button onclick="zoomOut()" class="p-2 bg-[#0b111a] hover:bg-cyan-900/50 text-cyan-400 rounded-lg border border-cyan-900/50 shadow-md">
                    <i data-lucide="zoom-out" class="w-5 h-5"></i>
                </button>
                <button onclick="zoomIn()" class="p-2 bg-[#0b111a] hover:bg-cyan-900/50 text-cyan-400 rounded-lg border border-cyan-900/50 shadow-md">
                    <i data-lucide="zoom-in" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- ステージ本体（横スクロール可能） -->
            <div class="flex-grow overflow-x-auto overflow-y-hidden relative flex items-end pt-20" id="stageScrollWrapper">
                
                <!-- 基準線コンテナ -->
                <div id="linesContainer" class="absolute inset-0 pointer-events-none"></div>

                <!-- キャラクターが並ぶコンテナ -->
                <div id="stageContainer" class="relative flex items-end gap-2 sm:gap-6 px-12 pb-0 min-w-max h-full z-10">
                    <!-- JSでキャラを描画 -->
                </div>

            </div>
            
            <!-- 床 -->
            <div class="h-4 sm:h-6 w-full bg-gradient-to-b from-cyan-950 to-[#050b14] border-t border-cyan-800 shadow-[0_-5px_15px_rgba(6,182,212,0.1)] z-20 flex-none"></div>
        </div>

    </main>

    <script>
        let allCharacters = [];
        let selectedIds = new Set();
        let cmPerPx = 3.5; // デフォルトズーム
        
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadCharacters();
            drawLines();
        });

        function extractHeight(str) {
            if (!str) return null;
            // 全角数字を半角に変換
            const halfStr = str.replace(/[０-９]/g, function(s) {
                return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
            });
            // 数字と小数点のみを抽出
            const match = halfStr.match(/[0-9]+(\.[0-9]+)?/);
            if (match && match[0]) {
                const h = parseFloat(match[0]);
                if (h > 0 && h < 500) return h; // 異常値を除外（0〜500cmまで）
            }
            return null;
        }

        function convertToDisplayUrl(url) {
            if (!url) return '';
            const driveRegex = /https:\/\/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/;
            const match = url.match(driveRegex);
            if (match && match[1]) {
                return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
            }
            const driveRegex2 = /https:\/\/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/;
            const match2 = url.match(driveRegex2);
            if (match2 && match2[1]) {
                return `https://drive.google.com/thumbnail?id=${match2[1]}&sz=w1000`;
            }
            return url;
        }

        function loadCharacters() {
            try {
                let parsed = [];
                const data = localStorage.getItem('weby_trpg_characters');
                if (data) {
                    parsed = JSON.parse(data);
                }
                
                // weby_profile_targets からのプロファイルデータの補完
                const profileData = localStorage.getItem('weby_profile_targets');
                if (profileData) {
                    const profiles = JSON.parse(profileData);
                    profiles.forEach(p => {
                        const target = parsed.find(c => c.id === p.id);
                        if (target && p.profile) {
                            target.profile = { ...target.profile, ...p.profile };
                            target.iconUrl = p.iconUrl || target.iconUrl;
                        } else if (!target) {
                            parsed.push(p);
                        }
                    });
                }
                
                if (parsed.length > 0) {
                    parsed.forEach(c => {
                        const profileHeight = c.profile && c.profile.height ? String(c.profile.height) : '';
                        const parsedHeight = extractHeight(profileHeight);
                        if (parsedHeight !== null) {
                            let imgUrl = null;
                            if (c.profile && c.profile.standingImage) {
                                imgUrl = convertToDisplayUrl(c.profile.standingImage);
                            }
                            
                            allCharacters.push({
                                id: c.id,
                                name: c.name,
                                heightStr: profileHeight,
                                heightCm: parsedHeight,
                                imgUrl: imgUrl
                            });
                        }
                    });
                    
                    // 身長順にソート
                    allCharacters.sort((a, b) => a.heightCm - b.heightCm);

                    // 初期選択（最大5人）
                    for (let i = 0; i < Math.min(5, allCharacters.length); i++) {
                        selectedIds.add(allCharacters[i].id);
                    }
                }
            } catch (e) {
                console.error("データの読み込みに失敗", e);
            }
            renderList();
            renderStage();
        }

        function renderList() {
            const listEl = document.getElementById('characterList');
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            listEl.innerHTML = '';

            allCharacters.forEach(char => {
                if (query && !char.name.toLowerCase().includes(query)) return;

                const isSelected = selectedIds.has(char.id);
                
                const label = document.createElement('label');
                label.className = `flex items-center gap-3 p-2 rounded-lg cursor-pointer transition-colors ${isSelected ? 'bg-cyan-900/30 border border-cyan-800/50' : 'hover:bg-[#131b26] border border-transparent'}`;
                
                label.innerHTML = \`
                    <div class="relative flex items-center justify-center w-5 h-5 border \${isSelected ? 'border-cyan-400 bg-cyan-900' : 'border-stone-600 bg-stone-900'} rounded">
                        \${isSelected ? '<i data-lucide="check" class="w-3 h-3 text-cyan-400 absolute"></i>' : ''}
                        <input type="checkbox" class="hidden" \${isSelected ? 'checked' : ''} onchange="toggleSelection('\${char.id}')">
                    </div>
                    <div class="flex-grow min-w-0">
                        <div class="text-sm font-bold text-stone-200 truncate">\${char.name}</div>
                        <div class="text-xs text-cyan-500 font-mono">\${char.heightCm} cm</div>
                    </div>
                \`;
                
                listEl.appendChild(label);
            });
            lucide.createIcons();
        }

        function toggleSelection(id) {
            if (selectedIds.has(id)) {
                selectedIds.delete(id);
            } else {
                selectedIds.add(id);
            }
            renderList();
            renderStage();
        }

        function clearSelection() {
            selectedIds.clear();
            renderList();
            renderStage();
        }

        function renderStage() {
            const stageEl = document.getElementById('stageContainer');
            stageEl.innerHTML = '';

            const selectedChars = allCharacters.filter(c => selectedIds.has(c.id));
            
            selectedChars.forEach(char => {
                const charDiv = document.createElement('div');
                charDiv.className = "relative flex flex-col items-center justify-end group transition-all duration-300 shrink-0";
                
                // 身長に基づいた高さを計算
                const pxHeight = char.heightCm * cmPerPx;
                
                let contentHtml = '';
                if (char.imgUrl) {
                    contentHtml = \`<img src="\${char.imgUrl}" class="h-full w-auto object-contain object-bottom drop-shadow-[0_0_10px_rgba(6,182,212,0.3)] transition-transform duration-300 group-hover:scale-[1.02]" style="height: \${pxHeight}px;">\`;
                } else {
                    // 立ち絵がない場合はシルエット
                    contentHtml = \`
                        <div class="flex flex-col items-center justify-end" style="height: \${pxHeight}px; width: \${pxHeight * 0.3}px;">
                            <div class="w-full h-full chara-silhouette opacity-60 group-hover:opacity-100 transition-opacity"></div>
                        </div>
                    \`;
                }

                charDiv.innerHTML = \`
                    <!-- ホバー時に表示される情報 -->
                    <div class="absolute -top-16 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col items-center pointer-events-none z-20">
                        <div class="bg-cyan-950/90 border border-cyan-500/50 px-3 py-1.5 rounded-lg shadow-lg whitespace-nowrap">
                            <div class="text-white font-bold text-sm">\${char.name}</div>
                            <div class="text-cyan-300 text-xs font-mono text-center">\${char.heightCm} cm</div>
                        </div>
                        <div class="w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-t-[6px] border-t-cyan-500/50"></div>
                    </div>
                    
                    \${contentHtml}
                    
                    <!-- 常時表示の名前ラベル（下部） -->
                    <div class="absolute -bottom-6 text-[10px] text-cyan-200/80 font-bold whitespace-nowrap truncate w-full text-center drop-shadow-md">\${char.name.substring(0,6)}\${char.name.length > 6 ? '...' : ''}</div>
                \`;
                
                stageEl.appendChild(charDiv);
            });
        }

        function drawLines() {
            const container = document.getElementById('linesContainer');
            container.innerHTML = '';
            
            // 最大300cmまで線を描画
            for (let cm = 0; cm <= 300; cm += 10) {
                const pxHeight = cm * cmPerPx;
                const line = document.createElement('div');
                
                const isMajor = cm % 50 === 0;
                line.className = \`height-line \${isMajor ? 'major' : ''}\`;
                line.style.bottom = \`\${pxHeight}px\`;
                
                // 偶数（20, 40...）または50の倍数の時に数値を表示
                if (cm > 0 && (cm % 20 === 0 || isMajor)) {
                    line.textContent = \`\${cm}cm\`;
                }
                
                container.appendChild(line);
            }
        }

        function zoomIn() {
            if (cmPerPx < 8) {
                cmPerPx += 0.5;
                document.documentElement.style.setProperty('--cm-px', \`\${cmPerPx}px\`);
                drawLines();
                renderStage();
            }
        }

        function zoomOut() {
            if (cmPerPx > 1.5) {
                cmPerPx -= 0.5;
                document.documentElement.style.setProperty('--cm-px', \`\${cmPerPx}px\`);
                drawLines();
                renderStage();
            }
        }
    </script>
</body>
</html>
