        visual: "まんまるでもっちりとした真っ白い綿毛のようなボディ。つぶらな糸目。小さな黒いくちばしと羽。",
        prompt: "A tiny cute fluffy round long-tailed tit bird character, pure white spherical soft body, smiling thread eyes, tiny black beak, minimalist chibi mascot, white background"
      },
      {
        id: "OCT001",
        category: "sea",
        name: "ラムネ",
        role: "好奇心・深海探検・逃走担当",
        species: "メンダコ",
        age: "年齢不詳（ぷにぷに枠）",
        bgGradient: "from-pink-400 to-cyan-500",
        accentColor: "#06b6d4",
        badgeBg: "bg-cyan-100 text-cyan-800",
        avatarBg: "bg-cyan-50 border-cyan-200",
        icon: "🐙",
        personality: "好奇心旺盛・ちょっぴりビビり・逃げ足最速。ピンチになると平たくペチャンコになって気配を消す。",
        firstPerson: "ラムネ / ぼく",
        bestFriend: "ロロ（ご近所親友・唯一の話し相手）",
        likes: "新しいもの、探検、ロロとのおしゃべり、貝殻",
        dislikes: "陸の強い日差し、捕まること、驚かされること",
        treasure: "海底で見つけたラムネ色のガラス玉",
        dream: "海の果てまで探検して面白いものを全部見つける",
        quote: "「にげろ〜〜っ！」",
        stamp: "STK-032 (耳パタパタ爆速逃走)",
        colors: "パステルピンク × ラムネブルーグラデーション",
        visual: "傘のように丸く平たいメンダコボディ。頭上の小さなヒレ耳。上がピンク、下がソーダブルーのグラデーション。",
        prompt: "A cute chibi flapjack octopus character, umbrella-shaped soft body with tiny ear flaps, pastel pink to soda blue gradient, big anime eyes, white background"
      },
      {
        id: "PON001",
        category: "mascot",
        name: "ゆめか",
        role: "家庭教師 / 憧れのお姉さん枠",
        species: "ゆめかわポニー",
        age: "人間換算 約16〜18歳",
        bgGradient: "from-purple-400 via-pink-400 to-sky-300",
        accentColor: "#c084fc",
        badgeBg: "bg-fuchsia-100 text-fuchsia-800",
        avatarBg: "bg-fuchsia-50 border-fuchsia-200",
        icon: "🦄",
        personality: "のほほん・おっとり・やさしい・包容力抜群。子狐たちにお勉強を教えてくれる。ほたるの憧れの相手。",
        firstPerson: "わたし / ゆめか",
        bestFriend: "子狐4つ子 / ほたる（憧れの視線）",
        likes: "お昼寝、お星さま、ふわふわの雲、わたあめ",
        dislikes: "争いごと、悲しい悪夢、急かされること",
        treasure: "右お尻のカットマーク（雲とお星さま）",
        dream: "みんなの夢を集めて優しい気持ちと笑顔を世界に届ける",
        quote: "「えらいねぇ〜♡」",
        stamp: "STK-036 (包容・褒めなで)",
        colors: "パステルレインボー × スノーホワイト",
        visual: "まっ白で丸みのあるポニーボディ。パステルレインボーグラデーションのふわふわなたてがみ＆尾。星の髪飾り。",
        prompt: "A cute chibi yumekawa pastel pony character, pure white body, fluffy mane with pastel rainbow gradient, star accessory, cloud cutie mark, kawaii storybook illustration"
      }
    ];

    let currentFilter = 'all';
    let currentSelectedId = 'FOX001';

    // 初期化
    document.addEventListener('DOMContentLoaded', () => {
      renderList();
      renderMainCard(currentSelectedId);
    });

    // フィルター処理
    function filterCategory(cat) {
      currentFilter = cat;
      document.querySelectorAll('#category-filters button').forEach(btn => {
        btn.classList.remove('bg-rose-500', 'text-white');
        btn.classList.add('bg-white', 'text-slate-600');
      });
      event.currentTarget.classList.remove('bg-white', 'text-slate-600');
      event.currentTarget.classList.add('bg-rose-500', 'text-white');

      renderList();
    }

    // リストレンダリング
    function renderList() {
      const container = document.getElementById('character-list');
      container.innerHTML = '';

      const filtered = characters.filter(c => currentFilter === 'all' || c.category === currentFilter);
      document.getElementById('char-count').innerText = `${filtered.length}匹`;

      filtered.forEach(char => {
        const isSelected = char.id === currentSelectedId;
        const card = document.createElement('div');
        card.className = `p-3 rounded-xl cursor-pointer border transition flex items-center gap-3 ${
          isSelected 
            ? 'bg-rose-50 border-rose-300 shadow-sm ring-2 ring-rose-400' 
            : 'bg-white hover:bg-slate-50 border-slate-100'
        }`;
        card.onclick = () => selectCharacter(char.id);

        card.innerHTML = `
          <div class="w-10 h-10 rounded-full flex items-center justify-center text-xl shrink-0 ${char.avatarBg}">
            ${char.icon}
          </div>
          <div class="min-w-0 flex-1">
            <div class="flex items-center justify-between">
              <h3 class="font-bold text-sm text-slate-800 truncate">${char.name}</h3>
              <span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded ${char.badgeBg}">${char.species}</span>
            </div>
            <p class="text-[11px] text-slate-400 truncate">${char.role}</p>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // キャラ選択
    function selectCharacter(id) {
      currentSelectedId = id;
      renderList();
      renderMainCard(id);
    }

    // メインカード描画
    function renderMainCard(id) {
      const char = characters.find(c => c.id === id);
      if (!char) return;

      const container = document.getElementById('main-profile-card');
      
      container.innerHTML = `
        <!-- ヘッダーバンパー -->
        <div class="absolute top-0 left-0 right-0 h-28 bg-gradient-to-r ${char.bgGradient} p-6 flex justify-between items-start text-white">
          <div>
            <span class="text-xs font-mono font-bold opacity-80">${char.id}</span>
            <span class="ml-2 text-xs font-bold px-2 py-0.5 rounded-full bg-white/20 backdrop-blur-sm">${char.species}</span>
          </div>
          <span class="text-3xl">${char.icon}</span>
        </div>

        <!-- キャラクター基本ヘッダー -->
        <div class="relative pt-12 mb-6 flex flex-col md:flex-row items-center md:items-end gap-4 border-b border-slate-100 pb-6">
          <div class="w-24 h-24 md:w-28 md:h-28 rounded-3xl ${char.avatarBg} border-4 border-white shadow-xl flex items-center justify-center text-5xl md:text-6xl shrink-0 z-10 bg-white">
            ${char.icon}
          </div>
          <div class="text-center md:text-left flex-1">
            <h2 class="text-2xl md:text-3xl font-black text-slate-800 flex items-center justify-center md:justify-start gap-2">
              <span>${char.name}</span>
            </h2>
            <p class="text-sm font-bold text-rose-500 mt-0.5">${char.role}</p>
            <p class="text-xs text-slate-400 mt-1"><i class="fa-solid fa-clock mr-1"></i>${char.age}</p>
          </div>
          <div class="text-right">
            <div class="bg-slate-50 px-3 py-2 rounded-xl border border-slate-100 text-center">
              <span class="text-[10px] font-bold text-slate-400 block">代表口調・台詞</span>
              <span class="text-xs font-black text-slate-700">${char.quote}</span>
            </div>
          </div>
        </div>

        <!-- 詳細情報グリッド -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs md:text-sm">
          
          <div class="space-y-3">
            <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-100">
              <span class="font-bold text-slate-500 text-xs block mb-1"><i class="fa-solid fa-heart text-rose-400 mr-1.5"></i>性格・特徴</span>
              <p class="text-slate-700 leading-relaxed font-bold">${char.personality}</p>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                <span class="font-bold text-slate-400 text-[10px] block">一人称</span>
                <span class="font-extrabold text-slate-700">${char.firstPerson}</span>
              </div>
              <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                <span class="font-bold text-slate-400 text-[10px] block">一番仲良し</span>
                <span class="font-extrabold text-slate-700">${char.bestFriend}</span>
              </div>
            </div>

            <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-100 space-y-2">
              <div>
                <span class="font-bold text-emerald-600 text-xs block"><i class="fa-solid fa-thumbs-up mr-1"></i>一番好きなもの</span>
                <span class="text-slate-700 font-bold">${char.likes}</span>
              </div>
              <div>
                <span class="font-bold text-rose-500 text-xs block"><i class="fa-solid fa-thumbs-down mr-1"></i>苦手・嫌いなもの</span>
                <span class="text-slate-700 font-bold">${char.dislikes}</span>
              </div>
            </div>
          </div>

          <div class="space-y-3">
            <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-100 space-y-2">
              <div>
                <span class="font-bold text-amber-500 text-xs block"><i class="fa-solid fa-gem mr-1"></i>宝物</span>
                <span class="text-slate-700 font-bold">${char.treasure}</span>
              </div>
              <div>
                <span class="font-bold text-indigo-500 text-xs block"><i class="fa-solid fa-star mr-1"></i>将来の夢</span>
                <span class="text-slate-700 font-bold">${char.dream}</span>
              </div>
            </div>

            <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-100">
              <span class="font-bold text-slate-500 text-xs block mb-1"><i class="fa-solid fa-palette text-purple-400 mr-1.5"></i>担当カラー ＆ ビジュアル設定</span>
              <p class="text-xs text-purple-600 font-extrabold mb-1">${char.colors}</p>
              <p class="text-slate-600 text-xs leading-relaxed">${char.visual}</p>
            </div>

            <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex items-center justify-between">
              <div>
                <span class="font-bold text-slate-400 text-[10px] block">LINEスタンプ代表作</span>
                <span class="font-bold text-slate-700 text-xs">${char.stamp}</span>
              </div>
              <button onclick="copyPrompt('${char.prompt.replace(/'/g, "\\'")}')" class="bg-rose-100 hover:bg-rose-200 text-rose-700 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1">
                <i class="fa-regular fa-copy"></i>
                <span>AIプロンプトコピー</span>
              </button>
            </div>
          </div>

        </div>
      `;
    }

    // AIプロンプトコピー関数
    function copyPrompt(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('AI生成用プロンプトをクリップボードにコピーしました！\n\n' + text);
      });
    }
  </script>
</body>
</html>
