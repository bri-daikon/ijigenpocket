<style>
:root{color-scheme:light;--pink:#e0658a;--ink:#48363f;--muted:#76646c;--pale:#fff0f5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff9fb,#fceaf0);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP","Yu Gothic",sans-serif;font-size:16px;line-height:1.8}main{max-width:720px;margin:48px auto;padding:0 20px}.card{background:#fff;border:1px solid #f2dce4;border-radius:24px;padding:40px;box-shadow:0 12px 48px #9a456510}h1{font-size:clamp(25px,5vw,34px);line-height:1.5;margin:12px 0 20px}h2{font-size:21px;line-height:1.6}h3{font-size:18px;margin-bottom:8px}p{margin:12px 0}.hero{display:block;width:min(320px,80%);height:auto;margin:0 auto 20px;border-radius:20px}.eyebrow{color:#a64062;font-weight:700;letter-spacing:.12em}.muted{color:var(--muted)}button{font:inherit;cursor:pointer;min-height:52px;border:1px solid #dfbac8;border-radius:12px;padding:12px 20px;background:#fff;color:var(--ink);touch-action:manipulation}button:hover{background:var(--pale)}button:focus-visible{outline:3px solid #a64062;outline-offset:4px}.primary{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:700}.primary:hover{background:#bd456a}.start-action{width:100%;margin-top:24px}.meta{display:flex;justify-content:space-between;gap:12px;align-items:center}progress{display:block;width:100%;height:10px;border:0;border-radius:10px;overflow:hidden;margin:12px 0 28px;background:var(--pale);accent-color:var(--pink)}progress::-webkit-progress-bar{background:var(--pale)}progress::-webkit-progress-value{background:var(--pink)}progress::-moz-progress-bar{background:var(--pink)}.choices{display:grid;gap:12px;margin:24px 0}.choice{display:flex;align-items:center;gap:14px;text-align:left;width:100%}.letter{display:inline-grid;place-items:center;flex-shrink:0;width:32px;height:32px;border-radius:50%;background:var(--pale);color:#a64062;font-weight:700}.choice[aria-pressed="true"]{border:2px solid var(--pink);background:var(--pale)}button:disabled{opacity:.45;cursor:default}.step{background:var(--pale);border-radius:16px;padding:8px 22px 18px;margin:24px 0}.recommendations{padding-left:24px}.recommendations li{padding:4px 0}.score-row{margin:16px 0}.score-label{display:flex;justify-content:space-between;gap:16px}.track{height:12px;background:#f5edf0;border-radius:12px;overflow:hidden;margin-top:6px}.fill{height:100%;background:#d9b8c4;border-radius:12px}.winner{font-weight:700;color:#a64062}.winner .fill{background:var(--pink)}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.actions button{flex:1}.note{font-size:16px;margin-top:24px}[hidden]{display:none!important}@media(max-width:520px){main{margin:20px auto;padding:0 12px}.card{padding:26px 20px;border-radius:20px}.actions{flex-direction:column}.score-label{font-size:16px;gap:8px}}@media print{body{background:#fff;color:#000}main{max-width:none;margin:0;padding:0}.card{border:0;box-shadow:none;padding:0}#start,#quiz,.actions{display:none!important}#result{display:block!important}body:not(.has-result) main{display:none}.step,.score-row{break-inside:avoid}*{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
.share-link{display:inline-block;flex:1;text-align:center;text-decoration:none;font:inherit;min-height:52px;border:1px solid #dfbac8;border-radius:12px;padding:12px 20px;background:#fff;color:var(--ink);touch-action:manipulation}.share-link:hover{background:var(--pale)}.share-link:focus-visible{outline:3px solid #a64062;outline-offset:4px}

};
const $ = id => document.getElementById(id);
let answers = Array(questions.length).fill(null);
let current = 0;
function showScreen(id){
 ['start','quiz','result'].forEach(name => {$(name).hidden = name !== id;});
 document.body.classList.toggle('has-result',id === 'result');
}
function calculateScores(responses){
 const scores = {D:0,W:0,H:0,S:0,N:0};
 responses.forEach((answer,index) => {
  if(answer !== null) Object.entries(questions[index].options[answer][1]).forEach(([type,points]) => {scores[type] += points;});
 });
 return scores;
}
function winningType(scores){return typeOrder.reduce((best,type) => scores[type] > scores[best] ? type : best,'D');}
function renderQuestion(){
 showScreen('quiz');
 $('counter').textContent = `質問 ${current + 1} / ${questions.length}`;
 $('progress').value = current;
 $('progress').textContent = `${current} / ${questions.length}`;
 $('question-title').textContent = questions[current].text;
 $('choices').replaceChildren();
 questions[current].options.forEach(([label],index) => {
  const button = document.createElement('button');
  button.type = 'button'; button.className = 'choice';
  button.setAttribute('aria-pressed',String(answers[current] === index));
  const letter = document.createElement('span'); letter.className = 'letter'; letter.textContent = 'ABCD'[index];
  const text = document.createElement('span'); text.textContent = label;
  button.append(letter,text);
  button.addEventListener('click',() => {
   answers[current] = index;
   if(current < questions.length - 1){current++;renderQuestion();}else{renderResult();}
  });
  $('choices').append(button);
 });
 $('back').disabled = current === 0;
 $('question-title').focus();
}
function renderResult(){
 const scores = calculateScores(answers), winner = winningType(scores), type = types[winner];
 $('result-title').textContent = `あなたは【${type.name}】です`;
 const postText = `副業の強み診断をやってみたら、私は【${type.name}】でした！おすすめは「${type.items[0]}」。あなたは何タイプ？ #副業 #副業診断`;
 const shareText = encodeURIComponent(postText + (SHARE_URL ? '\n診断はこちらから👇\n' + SHARE_URL : ''));
 $('share-x').href = `https://twitter.com/intent/tweet?text=${shareText}`;
 $('share-threads').href = `https://www.threads.net/intent/post?text=${shareText}`;
 $('description').textContent = type.description;
 $('recommendations').replaceChildren();
 type.items.forEach(item => {const li = document.createElement('li');li.textContent = item;$('recommendations').append(li);});
 $('first-step').textContent = type.step;
 $('result-art').src = typeArt[winner];
 $('result-art').alt = type.name + 'のポリーのイラスト';
 $('scores').replaceChildren();
 typeOrder.forEach(key => {
  const row = document.createElement('div');row.className = 'score-row' + (key === winner ? ' winner' : '');
  const label = document.createElement('div');label.className = 'score-label';
  const name = document.createElement('span');name.textContent = `${key} ${types[key].name}${key === winner ? '（診断タイプ）' : ''}`;
  const value = document.createElement('span');value.textContent = `${scores[key]}点`;
  label.append(name,value);
  const track = document.createElement('div');track.className = 'track';track.setAttribute('aria-hidden','true');
  const fill = document.createElement('div');fill.className = 'fill';fill.style.width = `${Math.min(100, scores[key] / 16 * 100)}%`;
  track.append(fill);row.append(label,track);$('scores').append(row);
 });
 showScreen('result');$('result-title').focus();
}
$('begin').addEventListener('click',renderQuestion);
$('back').addEventListener('click',() => {if(current > 0){current--;renderQuestion();}});
$('print').addEventListener('click',() => window.print());
$('restart').addEventListener('click',() => {answers = Array(questions.length).fill(null);current = 0;showScreen('start');$('begin').focus();});
</script>
