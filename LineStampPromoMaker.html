<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINEスタンプ一括告知バナー＆モックアップメーカー - 異次元ポケット工房</title>
    <!-- Tailwind CSS (Aesthetics and Responsiveness) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        line: {
                            DEFAULT: '#06c755',
                            dark: '#04a847',
                            light: '#28e070',
                            bg: '#0e1e17'
                        }
                    },
                    fontFamily: {
                        maru: ['"Zen Maru Gothic"', '"M PLUS Rounded 1c"', 'sans-serif'],
                        sans: ['"Inter"', '"M PLUS Rounded 1c"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- JSZip for extracting zip archives -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- html2canvas for High-Res PNG Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            font-family: 'Zen Maru Gothic', 'Inter', sans-serif;
            background-color: #0b0f19;
            background-image:
                radial-gradient(circle at 100% 0%, #0d261a 0%, transparent 45%),
                radial-gradient(circle at 0% 100%, #151c2d 0%, transparent 45%);
            background-attachment: fixed;
            color: #f1f5f9;
        }

        /* 視認性の高いカスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        ::-webkit-scrollbar-thumb {
            background: #2b384e;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #435472;
        }

        .active-pill {
            background: #06c755 !important;
            color: #0b0f19 !important;
            font-weight: 800 !important;
            border-color: #06c755 !important;
            box-shadow: 0 0 12px rgba(6, 199, 85, 0.4) !important;
        }

        @keyframes bounceSlow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .animate-bounce-slow {
            animation: bounceSlow 3s ease-in-out infinite;
        }
    </style>
</head>

<body class="min-h-screen text-slate-100 flex flex-col antialiased">

    <!-- ヘッダー（ブランド＆ナビゲーション） -->
    <header class="border-b border-slate-800 bg-[#111726]/90 backdrop-blur-md sticky top-0 z-40 px-4 py-3 shadow-lg shrink-0">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-emerald-500 to-green-600 flex items-center justify-center text-slate-950 font-black shadow-[0_0_15px_rgba(6,199,85,0.4)]">
                    <i data-lucide="megaphone" class="w-5 h-5"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-lg md:text-xl font-black tracking-tight text-white flex items-center gap-2">
                            LINEスタンプ告知バナーメーカー
                        </h1>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-mono">PROMO</span>
                    </div>
                    <p class="text-[10px] text-slate-400 font-bold">
                        発売告知・モックアップ画像・X投稿用バナーを一瞬で生成
                    </p>
                </div>
            </div>

            <!-- アクション・導線メニュー -->
            <div class="flex items-center gap-1.5 flex-wrap justify-center">
                <!-- 既存LINEスタンプツールへの相互リンク -->
                <a href="LineStampReelsMaker.html" class="flex items-center gap-1 px-2.5 py-1.5 text-xs font-bold bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-lg transition-all border border-slate-700 shadow-sm" title="リール動画メーカーへ">
                    <i data-lucide="video" class="w-3.5 h-3.5 text-emerald-400"></i> リール動画
                </a>
                <a href="AILineStampProducer.html" class="flex items-center gap-1 px-2.5 py-1.5 text-xs font-bold bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-lg transition-all border border-slate-700 shadow-sm" title="AIスタンプ工房へ">
                    <i data-lucide="scissors" class="w-3.5 h-3.5 text-rose-400"></i> AIスタンプ工房
                </a>
                <a href="LineStampSales.html" class="flex items-center gap-1 px-2.5 py-1.5 text-xs font-bold bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-lg transition-all border border-slate-700 shadow-sm" title="売上集計へ">
                    <i data-lucide="bar-chart-2" class="w-3.5 h-3.5 text-blue-400"></i> 売上集計
                </a>
                <a href="LinestampCharaShoukai.html" class="flex items-center gap-1 px-2.5 py-1.5 text-xs font-bold bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-lg transition-all border border-slate-700 shadow-sm" title="キャラクター図鑑へ">
                    <i data-lucide="users" class="w-3.5 h-3.5 text-amber-400"></i> キャラ図鑑
                </a>

                <div class="h-4 w-px bg-slate-800 mx-1 hidden sm:block"></div>

                <!-- エクスポート系ボタン -->
                <button onclick="copyXPromoText()" class="flex items-center gap-1 px-3 py-1.5 text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg transition-all border border-slate-700" title="X告知用テキストをコピー">
                    <i data-lucide="clipboard-copy" class="w-3.5 h-3.5 text-sky-400"></i> 文面コピー
                </button>
                <button onclick="exportBannerImage()" class="flex items-center gap-1 px-3.5 py-1.5 text-xs font-black bg-gradient-to-r from-emerald-500 to-green-500 hover:from-emerald-400 hover:to-green-400 text-slate-950 rounded-lg transition-all shadow-[0_0_15px_rgba(6,199,85,0.4)] border border-emerald-400" title="高画質PNG画像を出力">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i> 画像出力 (PNG)
                </button>
            </div>
        </div>
    </header>

    <!-- メインワークスペース（2ペインレイアウト） -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

        <!-- 左ペイン: コントロール & スタンプ管理 (lg:col-span-4) -->
        <aside class="lg:col-span-4 flex flex-col gap-5 sticky top-20">

            <!-- スタンプアップロード ＆ 取り込みエリア -->
            <div class="p-4 md:p-5 rounded-2xl bg-[#151c2d]/90 border border-slate-800 shadow-xl backdrop-blur">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
                        <i data-lucide="image-plus" class="w-4 h-4 text-emerald-400"></i> スタンプ画像の取込
                    </h2>
                    <span id="stampTotalCount" class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-slate-800 text-emerald-400 font-bold">0個</span>
                </div>

                <!-- ドラッグ＆ドロップ領域 -->
                <div id="stampDropArea" class="border-2 border-dashed border-slate-700 hover:border-emerald-500 rounded-xl p-5 text-center cursor-pointer transition-all bg-slate-900/50 group">
                    <input type="file" id="stampFileInput" class="hidden" accept=".zip,image/png,image/jpeg,image/webp" multiple>
                    <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center mx-auto mb-2 group-hover:bg-emerald-950/40 text-slate-400 group-hover:text-emerald-400 transition-colors">
                        <i data-lucide="file-archive" class="w-5 h-5"></i>
                    </div>
                    <p class="text-xs font-bold text-slate-200">ZIPまたはPNG画像をドロップ</p>
                    <p class="text-[10px] text-slate-500 mt-1">クリエイターズマーケットのZIPファイルを一発解凍！</p>
                </div>

                <!-- 読み込み済みサムネイルグリッド -->
                <div class="mt-4 pt-3 border-t border-slate-800/80">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-[11px] font-bold text-slate-400">ピックアップ選択 (バナー掲載)</span>
                        <div class="flex gap-2">
                            <button onclick="selectAllStamps()" class="text-[10px] text-emerald-400 hover:underline">全選択</button>
                            <span class="text-[10px] text-slate-600">|</span>
                            <button onclick="clearSelectedStamps()" class="text-[10px] text-slate-400 hover:underline">全解除</button>
                        </div>
                    </div>
                    <div id="stampThumbnailsList" class="grid grid-cols-4 gap-1.5 max-h-40 overflow-y-auto pr-1">
                        <!-- 動的生成 -->
                    </div>
                </div>
            </div>

            <!-- バナー構成設定（テンプレート・比率・テーマ） -->
            <div class="p-4 md:p-5 rounded-2xl bg-[#151c2d]/90 border border-slate-800 shadow-xl backdrop-blur space-y-4">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
                    <i data-lucide="layout-template" class="w-4 h-4 text-emerald-400"></i> デザイン＆レイアウト
                </h2>

                <!-- テンプレート選択 -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1.5">レイアウトテンプレート</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="setTemplate('chat-mockup')" data-template="chat-mockup" class="template-btn active-pill p-2 rounded-xl border border-slate-700 bg-slate-900 text-left text-xs font-bold flex items-center gap-2">
                            <i data-lucide="smartphone" class="w-4 h-4"></i> スマホチャット風
                        </button>
                        <button onclick="setTemplate('grid-showcase')" data-template="grid-showcase" class="template-btn p-2 rounded-xl border border-slate-700 bg-slate-900 text-left text-xs font-bold flex items-center gap-2">
                            <i data-lucide="grid" class="w-4 h-4"></i> ピックアップ枠
                        </button>
                        <button onclick="setTemplate('poster-40')" data-template="poster-40" class="template-btn p-2 rounded-xl border border-slate-700 bg-slate-900 text-left text-xs font-bold flex items-center gap-2">
                            <i data-lucide="layout-grid" class="w-4 h-4"></i> 全体見本ポスター
                        </button>
                        <button onclick="setTemplate('highlight-card')" data-template="highlight-card" class="template-btn p-2 rounded-xl border border-slate-700 bg-slate-900 text-left text-xs font-bold flex items-center gap-2">
                            <i data-lucide="sparkles" class="w-4 h-4"></i> ハイライトカード
                        </button>
                    </div>
                </div>

                <!-- アスペクト比選択 -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1.5">画像サイズ (アスペクト比)</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setAspectRatio('16-9')" data-ratio="16-9" class="ratio-btn active-pill py-1.5 rounded-lg border border-slate-700 bg-slate-900 text-center text-xs font-bold">
                            16:9 (X/横長)
                        </button>
                        <button onclick="setAspectRatio('1-1')" data-ratio="1-1" class="ratio-btn py-1.5 rounded-lg border border-slate-700 bg-slate-900 text-center text-xs font-bold">
                            1:1 (正方形)
                        </button>
                        <button onclick="setAspectRatio('9-16')" data-ratio="9-16" class="ratio-btn py-1.5 rounded-lg border border-slate-700 bg-slate-900 text-center text-xs font-bold">
                            9:16 (ストーリー)
                        </button>
                    </div>
                </div>

                <!-- カラーテーマ選択 -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1.5">カラーテーマ</label>
                    <div class="flex items-center gap-2">
                        <button onclick="setColorTheme('line-green')" data-theme="line-green" class="theme-btn w-7 h-7 rounded-full bg-[#06c755] ring-2 ring-white shadow" title="LINEグリーン"></button>
                        <button onclick="setColorTheme('pastel-pink')" data-theme="pastel-pink" class="theme-btn w-7 h-7 rounded-full bg-[#ec4899] shadow" title="パステルチェリー"></button>
                        <button onclick="setColorTheme('cyber-dark')" data-theme="cyber-dark" class="theme-btn w-7 h-7 rounded-full bg-[#0ea5e9] shadow" title="サイバーナイト"></button>
                        <button onclick="setColorTheme('warm-craft')" data-theme="warm-craft" class="theme-btn w-7 h-7 rounded-full bg-[#f59e0b] shadow" title="ウォームクラフト"></button>
                        <button onclick="setColorTheme('vibrant-blue')" data-theme="vibrant-blue" class="theme-btn w-7 h-7 rounded-full bg-[#3b82f6] shadow" title="オーシャンブルー"></button>
                    </div>
                </div>
            </div>

            <!-- 告知情報入力 -->
            <div class="p-4 md:p-5 rounded-2xl bg-[#151c2d]/90 border border-slate-800 shadow-xl backdrop-blur space-y-3">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
                    <i data-lucide="edit-3" class="w-4 h-4 text-emerald-400"></i> テキスト・URL設定
                </h2>

                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1">スタンプタイトル</label>
                    <input type="text" id="inputTitle" class="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none">
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1">キャッチコピー</label>
                    <input type="text" id="inputCopy" class="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 mb-1">クリエイター名</label>
                        <input type="text" id="inputAuthor" class="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 mb-1">価格・コイン</label>
                        <input type="text" id="inputPrice" class="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 mb-1">帯バッジ文字</label>
                        <input type="text" id="inputBadgeText" class="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 mb-1">ストア販売URL (QR生成)</label>
                        <input type="text" id="inputStampUrl" class="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none font-mono">
                    </div>
                </div>
            </div>
        </aside>

        <!-- 右ペイン: リアルタイムプレビュー (lg:col-span-8) -->
        <section class="lg:col-span-8 flex flex-col items-center justify-center gap-4">

            <!-- プレビュー枠ツールバー -->
            <div class="w-full max-w-4xl flex items-center justify-between text-xs text-slate-400 px-2">
                <span class="flex items-center gap-1.5 font-bold">
                    <i data-lucide="eye" class="w-4 h-4 text-emerald-400"></i> プレビュー (実際の出力イメージ)
                </span>
                <span class="text-[11px] font-mono opacity-75">PNG高解像度出力 (Retina 2x) 対応</span>
            </div>

            <!-- バナー描画キャンバス領域 -->
            <div class="w-full flex items-center justify-center p-2 sm:p-4 rounded-3xl bg-[#080c14] border border-slate-800/80 shadow-2xl overflow-hidden min-h-[460px]">
                <div id="previewBanner">
                    <!-- JavaScriptで動的生成 -->
                </div>
            </div>

            <!-- 出力ガイド・ヒント -->
            <div class="w-full max-w-4xl p-4 rounded-2xl bg-slate-900/40 border border-slate-800 text-xs text-slate-400 flex items-center justify-between gap-4">
                <div class="flex items-center gap-2">
                    <i data-lucide="sparkles" class="w-4 h-4 text-amber-400 shrink-0"></i>
                    <span>「画像出力」ボタンを押すと、X(Twitter)やInstagramに最適な高画質PNG画像がダウンロードされます。</span>
                </div>
                <button onclick="copyXPromoText()" class="text-xs font-bold text-emerald-400 hover:text-emerald-300 shrink-0 underline">
                    文面をコピーして投稿へ ➔
                </button>
            </div>
        </section>
    </main>

    <!-- トースト通知 -->
    <div id="promoToast" class="fixed bottom-6 right-6 z-50 flex items-center gap-2.5 px-4 py-3 rounded-xl bg-slate-900 border border-emerald-500/80 text-xs text-white shadow-[0_4px_25px_rgba(0,0,0,0.8)] transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none">
        <span id="promoToastIcon"></span>
        <span id="promoToastMessage" class="font-bold"></span>
    </div>

    <!-- ロジックスクリプト -->
    <script src="js/LineStampPromoMaker.js"></script>
</body>
</html>
